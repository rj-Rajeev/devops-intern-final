name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILD_SHA="${{ github.sha }}" \
            --tag devops-intern-final:${{ github.sha }} \
            app

      - name: Save Docker image
        run: |
          docker save devops-intern-final:${{ github.sha }} \
            --output devops-intern-final-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: devops-intern-final-image
          path: devops-intern-final-image.tar

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: devops-intern-final-image

      - name: Load Docker image
        run: |
          docker load \
            --input devops-intern-final-image.tar

      - name: Start application container
        run: |
          docker run -d \
            --name devops-intern-final \
            -p 8080:8080 \
            devops-intern-final:${{ github.sha }}

      - name: Wait for application readiness
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8080/healthz; then
              exit 0
            fi

            sleep 2
          done

          echo "Application did not become ready in time"
          docker logs devops-intern-final
          exit 1

      - name: Run application health check
        run: |
          ./scripts/healthcheck.sh http://localhost:8080

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag Docker image
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/devops-intern-final"

          docker build \
            --build-arg BUILD_SHA="${{ github.sha }}" \
            --tag "${IMAGE}:${{ github.sha }}" \
            --tag "${IMAGE}:latest" \
            app

      - name: Push Docker image
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/devops-intern-final"

          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"
